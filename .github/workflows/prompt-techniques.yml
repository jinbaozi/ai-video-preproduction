name: Required method evidence hardening
on:
  push:
    branches: [feat/prompt-techniques-20261003]
permissions:
  contents: read
jobs:
  verified-source-and-release:
    if: github.repository == 'jinbaozi/ai-video-preproduction' && github.ref == 'refs/heads/feat/prompt-techniques-20261003'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify fixed parent and reviewed patch bytes
        run: |
          test "$(git rev-parse HEAD^)" = '152e3c5c0c55260dad20dc7b1ffa9c380f8c5b52'
          python - <<'PY'
          import bz2, hashlib
          from pathlib import Path
          data = Path('.github/prompt-techniques-proof-fix.bz2').read_bytes()
          assert len(data) == 3457
          assert hashlib.sha256(data).hexdigest() == '7ebc4fbc9a02d21e213614927b857dd135b882da122e01f072e66f964f17c934'
          decoder = bz2.BZ2Decompressor()
          patch = decoder.decompress(data, max_length=8513)
          assert decoder.eof and not decoder.unused_data and len(patch) == 8512
          assert hashlib.sha256(patch).hexdigest() == '52b4d187253c833a2511451734bd69ac37ab297f3d1f10d6e22f261112b35a23'
          Path('/tmp/prompt-proof.patch').write_bytes(patch)
          PY
          git apply --check /tmp/prompt-proof.patch
          git apply --index /tmp/prompt-proof.patch
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and rebuild all seven distributions
        run: |
          python -m pip install -e ./ai-comic-drama-workflow
          python ai-comic-drama-workflow/scripts/sync_shared.py --check
          python ai-comic-drama-workflow/scripts/package_suite.py --out dists
      - name: Test required evidence and legacy compatibility
        run: python -m unittest discover -s video-prompt-compiler/tests -p 'test_prompt_techniques.py' -v
      - name: Test native evidence through delivery
        env:
          PYTHONPATH: ai-comic-drama-workflow/src:ai-comic-drama-workflow
        run: python -m unittest tests.test_prompt_methods tests.test_craft_end_to_end -v
      - name: Verify exact reviewed final tree and publish feature branch
        run: |
          git rm .github/prompt-techniques-proof-fix.bz2
          git add dists ai-comic-drama-workflow/assets/bundled-skills ai-comic-drama-workflow/modules.lock.json
          git rm --cached .github/workflows/prompt-techniques.yml
          test "$(git write-tree)" = '4c1edf1a8323e97ac82a9ea9369f72f22fa9e375'
          git add .github/workflows/prompt-techniques.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: require prompt method evidence in new compiler packages'
          git push origin HEAD:refs/heads/feat/prompt-techniques-20261003
          git rev-parse HEAD
