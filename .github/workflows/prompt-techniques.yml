name: Final prompt validation hardening
on:
  push:
    branches: [feat/prompt-techniques-20261003]
permissions:
  contents: read
jobs:
  verified-source-and-release:
    if: github.repository == 'jinbaozi/ai-video-preproduction' && github.ref == 'refs/heads/feat/prompt-techniques-20261003'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify fixed parent and reviewed patch bytes
        run: |
          test "$(git rev-parse HEAD^)" = '685fc9b957844b059c6b5a6b6adf7e2f5db078e9'
          python - <<'PY'
          import bz2, hashlib
          from pathlib import Path
          data = Path('.github/prompt-techniques-followup.bz2').read_bytes()
          assert len(data) == 2915
          assert hashlib.sha256(data).hexdigest() == '5c63f8821f6bd3dbb19ac8a7a5f9b8dd9fcc470f605b490adba8c4182f338502'
          decoder = bz2.BZ2Decompressor()
          patch = decoder.decompress(data, max_length=6365)
          assert decoder.eof and not decoder.unused_data and len(patch) == 6364
          assert hashlib.sha256(patch).hexdigest() == 'dd1d49d2f11f7c8e301d74e5a5f8ea3af8a485fd81b94e7a45f429fd3d2b0a5a'
          Path('/tmp/prompt-techniques-followup.patch').write_bytes(patch)
          PY
          git apply --check /tmp/prompt-techniques-followup.patch
          git apply --index /tmp/prompt-techniques-followup.patch
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and rebuild all seven distributions
        run: |
          python -m pip install -e ./ai-comic-drama-workflow
          python ai-comic-drama-workflow/scripts/sync_shared.py --check
          python ai-comic-drama-workflow/scripts/package_suite.py --out dists
      - name: Test immutable compiler and malformed input diagnostics
        run: python -m unittest discover -s video-prompt-compiler/tests -p 'test_prompt_techniques.py' -v
      - name: Test native evidence through delivery
        env:
          PYTHONPATH: ai-comic-drama-workflow/src:ai-comic-drama-workflow
        run: python -m unittest tests.test_prompt_methods tests.test_craft_end_to_end -v
      - name: Verify exact reviewed final tree and publish feature branch
        run: |
          git rm .github/prompt-techniques-followup.bz2
          git add dists ai-comic-drama-workflow/assets/bundled-skills ai-comic-drama-workflow/modules.lock.json
          git rm --cached .github/workflows/prompt-techniques.yml
          test "$(git write-tree)" = 'a612dd266eedc5e90cc0deee48ddb3782c339ade'
          git add .github/workflows/prompt-techniques.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: return structured diagnostics for malformed prompt technique inputs'
          git push origin HEAD:refs/heads/feat/prompt-techniques-20261003
          git rev-parse HEAD
