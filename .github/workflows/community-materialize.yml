name: Materialize verified community knowledge
on:
  push:
    branches: [feat/community-knowledge-20261003]
permissions:
  contents: read
jobs:
  verified-source-and-release:
    if: github.repository == 'jinbaozi/ai-video-preproduction' && github.ref == 'refs/heads/feat/community-knowledge-20261003'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify fixed parent and reviewed patch bytes
        run: |
          test "$(git rev-parse HEAD^)" = '0d324fda0088f1441e183ed655b934110b093468'
          python - <<'PY'
          import bz2, hashlib
          from pathlib import Path
          data = b''.join((Path('.github/community-payload') / f'part-{i}.bin').read_bytes() for i in range(1, 5))
          assert len(data) == 32711
          assert hashlib.sha256(data).hexdigest() == '0b234b0a61e998a51119482b6688fd984feb53c333a1fa33251b27bb17262d25'
          decoder = bz2.BZ2Decompressor()
          patch = decoder.decompress(data, max_length=139015)
          assert decoder.eof and not decoder.unused_data and len(patch) == 139014
          assert hashlib.sha256(patch).hexdigest() == '4067583e1a4348ff4c3452e630450d8cd707427f0361046a88ef333bd2072b8d'
          Path('/tmp/community-source.patch').write_bytes(patch)
          PY
          git apply --check --exclude=.github/workflows/community-regression.yml --exclude=.github/workflows/community-source-snapshot.yml /tmp/community-source.patch
          git apply --index --exclude=.github/workflows/community-regression.yml --exclude=.github/workflows/community-source-snapshot.yml /tmp/community-source.patch
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and rebuild all seven distributions
        run: |
          python -m pip install -e ./ai-comic-drama-workflow
          python ai-comic-drama-workflow/scripts/sync_shared.py --check
          python ai-comic-drama-workflow/scripts/package_suite.py --out dists
      - name: Verify sources and all local routes
        run: |
          python video-prompt-compiler/scripts/reference_audit.py --suite .
          python video-prompt-compiler/scripts/vpc.py knowledge audit
          python -m unittest discover -s video-prompt-compiler/tests -p 'test_community_knowledge.py' -v
      - name: Verify seven-role adoption and native delivery
        env:
          PYTHONPATH: ai-comic-drama-workflow/src:ai-comic-drama-workflow
        run: python -m unittest tests.test_community_routing tests.test_craft_end_to_end -v
      - name: Match reviewed tree and publish feature branch
        run: |
          git rm -r .github/community-payload
          git add dists ai-comic-drama-workflow/assets/bundled-skills ai-comic-drama-workflow/modules.lock.json
          git rm --cached .github/workflows/community-materialize.yml .github/workflows/community-source-snapshot.yml
          test "$(git write-tree)" = '34330ac6c69b805264016ce63bee3b2b5938a7c5'
          git add .github/workflows/community-materialize.yml .github/workflows/community-source-snapshot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add source-grounded knowledge routing and scoped Omni compilation'
          git push origin HEAD:refs/heads/feat/community-knowledge-20261003
          git rev-parse HEAD
