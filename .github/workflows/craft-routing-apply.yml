name: Materialize validated craft routing
on:
  push:
    branches: ['feat/automatic-craft-routing-20260930']
    paths: ['.github/workflows/craft-routing-apply.yml', 'audit/_craft-transfer/**']
permissions:
  contents: write
concurrency:
  group: craft-routing-materialization
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and apply reviewed source patch
        run: |
          mkdir -p /tmp/craft-apply
          python - <<'PY'
          import bz2, hashlib, subprocess
          from pathlib import Path
          data = b''.join(Path(f'audit/_craft-transfer/part-{i:02d}.bin').read_bytes() for i in range(6))
          expected = '5b8e75a068f19b71225983ac1df9f93e97a31a95d1bee717389f2259c4158d41'
          assert hashlib.sha256(data).hexdigest() == expected, 'Patch transport checksum mismatch'
          patch = Path('/tmp/craft-apply/source.patch')
          patch.write_bytes(bz2.decompress(data))
          args = ['git', 'apply', '--exclude=.github/workflows/craft-routing.yml']
          subprocess.run(args + ['--check', str(patch)], check=True)
          subprocess.run(args + [str(patch)], check=True)
          PY
      - name: Install native validators
        run: |
          python -m pip install -e ./ai-comic-drama-workflow
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Synchronize and rebuild seven packages
        run: |
          python ai-comic-drama-workflow/scripts/sync_shared.py
          python ai-comic-drama-workflow/scripts/sync_shared.py --check
          python ai-comic-drama-workflow/scripts/package_suite.py --out dists
      - name: Verify routing and native text delivery
        run: |
          set -o pipefail
          python -m unittest discover -s ai-comic-drama-workflow/tests -p 'test_craft*.py' -v 2>&1 | tee /tmp/craft-apply/routing-tests.log
          for skill in screenplay-grammar director-grammar production-design-grammar storyboard-grammar; do
            (cd "$skill" && python -m unittest discover -s tests -v) 2>&1 | tee "/tmp/craft-apply/$skill.log"
          done
      - name: Commit validated sources and regenerated packages
        run: |
          git rm -r audit/_craft-transfer
          git add README.md ai-comic-drama-workflow director-grammar production-design-grammar screenplay-grammar storyboard-grammar image-prompt-optimizer video-prompt-compiler dists audit/automatic-craft-routing.md
          git diff --cached --check
          if git diff --cached --name-only | grep '^.github/'; then
            echo 'Workflow changes must use the authorized connector, not this job.'
            exit 2
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: enable default source-backed professional craft routing'
          git push origin HEAD:feat/automatic-craft-routing-20260930
          git rev-parse HEAD | tee /tmp/craft-apply/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: craft-materialization-evidence
          path: /tmp/craft-apply
          retention-days: 14
