name: Materialize compact stage output
on:
  push:
    branches: ['feat/compact-stage-output-20260930']
    paths: ['.github/workflows/compact-output-apply.yml', 'audit/_compact-transfer/**']
permissions:
  contents: write
concurrency:
  group: compact-output-materialization
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify transport and apply source patch
        run: |
          mkdir -p /tmp/compact-apply
          python - <<'PY'
          import bz2, hashlib, subprocess
          from pathlib import Path
          data = b''.join(Path(f'audit/_compact-transfer/part-{i:02d}.bin').read_bytes() for i in range(10))
          Path('/tmp/compact-apply/source.patch.bz2').write_bytes(data)
          expected = 'b14e47af93409fbd349cb6ca16b16746e03cac5a6f634bd45fb389279269a625'
          assert hashlib.sha256(data).hexdigest() == expected, 'Transport checksum mismatch'
          patch = Path('/tmp/compact-apply/source.patch')
          patch.write_bytes(bz2.decompress(data))
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', str(patch)], check=True)
          PY
      - name: Install native validation dependencies
        run: |
          python -m pip install -e ./ai-comic-drama-workflow
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Rebuild release packages
        run: |
          python ai-comic-drama-workflow/scripts/sync_shared.py --check
          python ai-comic-drama-workflow/scripts/package_suite.py --out dists
      - name: Validate compact output and preserved professional routing
        run: |
          set -o pipefail
          python -m unittest discover -s ai-comic-drama-workflow/tests -p 'test_compact_workspace.py' -v 2>&1 | tee /tmp/compact-apply/compact.log
          python -m unittest discover -s ai-comic-drama-workflow/tests -p 'test_lean_workflow.py' -v 2>&1 | tee /tmp/compact-apply/lean.log
          python -m unittest discover -s ai-comic-drama-workflow/tests -p 'test_craft*.py' -v 2>&1 | tee /tmp/compact-apply/craft.log
      - name: Commit validated source and regenerated packages
        run: |
          git rm -r audit/_compact-transfer
          git add README.md ai-comic-drama-workflow dists audit
          git diff --cached --check
          if git diff --cached --name-only | grep '^.github/'; then
            echo 'Workflow changes require the authorized connector.'
            exit 2
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: compact stage outputs with exact recoverable context'
          git push origin HEAD:feat/compact-stage-output-20260930
          git rev-parse HEAD > /tmp/compact-apply/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-materialization-evidence
          path: /tmp/compact-apply
          retention-days: 14
