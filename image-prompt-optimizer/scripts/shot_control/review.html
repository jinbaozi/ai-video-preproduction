<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>镜头调度审阅</title><style>
body{background:#0b1220;color:#e7eef9;font:16px system-ui;margin:32px auto;max-width:1400px;padding:0 24px}h1{font-size:30px}p{color:#a8b9ce;line-height:1.7}.views{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#141f31;padding:18px;border-radius:14px}svg{width:100%}input{width:75%}button{background:#86dcff;border:0;padding:12px 20px;border-radius:8px;margin-right:20px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}h2{font-size:17px}.status{color:#86dcff}@media(max-width:800px){.views{grid-template-columns:1fr}}
</style><h1>镜头调度 · 同源审阅</h1>
<p>世界坐标：右 X / 上 Y / 深 Z。圆点仅表示节点位置，颜色仅用于识别对象。摄影机预览是计划点投影，不证明人体姿态、遮挡、碰撞或成片服从度。未知状态保留空缺。</p>
<p class="status" id="time"></p><button id="play">播放</button><input id="timeline" type="range" min="0" value="0" step="1" aria-label="镜头时间轴">
<div class="views"><div class="card"><h2>俯视 · X–Z</h2><div id="top"></div></div><div class="card"><h2>摄影机 · 画面投影</h2><div id="camera"></div></div><div class="card"><h2>侧视 · X–Y</h2><div id="side"></div></div><div class="card"><h2>求值与缺项</h2><pre id="details"></pre></div></div>
<p>修改轨迹须回到上游 AVIR，重新派生此包。此页及带标记 SVG 仅供审阅，不能作为干净关键帧上传。</p>
<script>const frames=__DATA__;const slider=document.getElementById('timeline');slider.max=frames.length-1;let timer=null;function show(){const f=frames[+slider.value];document.getElementById('time').textContent=f.shot_id+' · '+(f.at_ms/1000).toFixed(3)+' 秒';for(const v of ['top','camera','side'])document.getElementById(v).innerHTML=f[v];document.getElementById('details').textContent=JSON.stringify(f.details,null,2)}slider.oninput=show;document.getElementById('play').onclick=function(){if(timer){clearTimeout(timer);timer=null;this.textContent='播放';return}this.textContent='暂停';function step(){const i=+slider.value;if(i>=frames.length-1){timer=null;document.getElementById('play').textContent='播放';return}slider.value=i+1;show();timer=setTimeout(step,Math.max(20,frames[i+1].at_ms-frames[i].at_ms))}timer=setTimeout(step,100)};show();</script></html>
