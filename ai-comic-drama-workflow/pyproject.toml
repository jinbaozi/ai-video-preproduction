[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-comic-drama-workflow"
version = "0.6.0"
description = "Schema-governed local runtime for AI comic-drama projects"
requires-python = ">=3.12"
dependencies = ["jsonschema==4.26.0"]

[project.optional-dependencies]
documents = ["python-docx>=1.1", "pypdf>=5"]
media = ["Pillow>=10"]

[project.scripts]
ai-comic-drama = "ai_comic_drama_workflow.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_comic_drama_workflow = ["py.typed"]

[tool.setuptools.data-files]
"share/ai-comic-drama-workflow" = ["workflow-graph.json", "legacy-workflow-graph.json", "resource-catalog.json", "SKILL.md", "modules.lock.json", "suite.json", "workflow-v5.json"]
"share/ai-comic-drama-workflow/adapters" = ["adapters/*.json"]
"share/ai-comic-drama-workflow/references" = ["references/*.md"]
"share/ai-comic-drama-workflow/references/phases" = ["references/phases/*.md"]
"share/ai-comic-drama-workflow/references/v4" = ["references/v4/*.md"]
"share/ai-comic-drama-workflow/schemas" = ["schemas/*.json"]

"share/ai-comic-drama-workflow/references/v5" = ["references/v5/*.md"]
"share/ai-comic-drama-workflow/assets/bundled-skills" = ["assets/bundled-skills/*"]
