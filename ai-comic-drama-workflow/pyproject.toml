[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-comic-drama-workflow"
version = "0.11.0"
description = "Schema-governed local runtime for AI comic-drama projects"
requires-python = ">=3.12"
dependencies = ["jsonschema==4.26.0"]

[project.scripts]
ai-comic-drama = "ai_comic_drama_workflow.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_comic_drama_workflow = ["py.typed"]

[tool.setuptools.data-files]
"share/ai-comic-drama-workflow" = ["SKILL.md", "modules.lock.json", "suite.json", "workflow-v5.json", "workflow-v6.json"]
"share/ai-comic-drama-workflow/references" = ["references/current-contract.md"]
"share/ai-comic-drama-workflow/references/history" = ["references/history/*"]
"share/ai-comic-drama-workflow/references/v5" = ["references/v5/*.md"]
"share/ai-comic-drama-workflow/references/v6" = ["references/v6/*.md"]
"share/ai-comic-drama-workflow/schemas" = ["schemas/v5-*.json", "schemas/v6-*.json"]
"share/ai-comic-drama-workflow/assets/bundled-skills" = ["assets/bundled-skills/*"]
